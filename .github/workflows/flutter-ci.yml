name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Setup Env for CI
        run: cp lib/env.example.dart lib/env.dart
      - name: Analyze project
        run: flutter analyze
      - name: Run tests
        run: flutter test
